name: Build and Deploy News Hub

on:
  schedule:
    # Läuft alle 30 Minuten nur zwischen 04:00 und 22:59 UTC
    # (entspricht nachts in DE einer Pause ab ca. 00:00/01:00 bis 06:00 Uhr)
    - cron: '*/30 4-22 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'build_pages.py'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: true

env:
  FORCE_REFRESH: "true"  

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache HTTP Metadata
        uses: actions/cache@v4
        with:
          path: cache_meta.json
          key: feed-cache-meta-${{ github.run_id }}
          restore-keys: |
            feed-cache-meta-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Build Script
        id: run_build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          FEEDS_OPML: ${{ secrets.FEEDS_OPML }}
          FEED_PRIORITIES: ${{ secrets.FEED_PRIORITIES }}
        run: python build_pages.py

      - name: Write robots.txt and .nojekyll
        if: steps.run_build.outputs.deploy == 'true' || github.event_name != 'schedule'
        run: |
          echo -e "User-agent: *\nDisallow: /" > public/robots.txt
          touch public/.nojekyll

      - name: Deploy to GitHub Pages
        if: steps.run_build.outputs.deploy == 'true' || github.event_name != 'schedule'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: false
