name: Build and Deploy News Hub

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache HTTP Metadata
        uses: actions/cache@v4
        with:
          path: cache_meta.json
          key: feed-cache-meta-${{ github.run_id }}
          restore-keys: |
            feed-cache-meta-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai pydantic requests cryptography

      - name: Fetch Current State
        id: pre_check
        run: |
          PREV_HASH=$(curl -s "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json" | sha256sum | awk '{print $1}')
          echo "prev_hash=$PREV_HASH" >> $GITHUB_OUTPUT

      - name: Run Build Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          FEEDS_OPML: ${{ secrets.FEEDS_OPML }}
          FEED_PRIORITIES: ${{ secrets.FEED_PRIORITIES }}
        run: python build_pages.py

      - name: Change Detection Guard
        id: change_check
        run: |
          NEW_HASH=$(sha256sum public/data.json | awk '{print $1}')
          if [ "$NEW_HASH" = "${{ steps.pre_check.outputs.prev_hash }}" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "deploy=false" >> $GITHUB_OUTPUT
          else
            echo "deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Write robots.txt
        if: steps.change_check.outputs.deploy == 'true'
        run: |
          echo "User-agent: *" > public/robots.txt
          echo "Disallow: /" >> public/robots.txt

      - name: Deploy to GitHub Pages
        if: steps.change_check.outputs.deploy == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: false
