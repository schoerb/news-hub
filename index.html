<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>News-Hub</title>
  <meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#121418">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <style>
    :root{--bg:#121418;--sidebar:#181b20;--card:#1e2229;--hover:#262b34;--border:#2e3440;--text:#e2e8f0;--muted:#94a3b8;--bold:#f1f5f9;--accent:#2ecc71;--accent-dim:rgba(46,204,113,.15);--link:#60a5fa}
    [data-theme="light"]{--bg:#f8fafc;--sidebar:#fff;--card:#fff;--hover:#f1f5f9;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--bold:#0f172a;--accent:#16a34a;--accent-dim:rgba(22,163,74,.12);--link:#2563eb}
    *{box-sizing:border-box;margin:0;padding:0}
    
    html, body {
      height: 100vh;
      overflow: hidden;
      overscroll-behavior-y: none;
      overscroll-behavior-x: none;
    }
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex}
    
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(3px);z-index:1100;align-items:center;justify-content:center;padding:16px}
    .modal-card{background:var(--sidebar);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:540px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 16px 36px rgba(0,0,0,.35)}
    .modal-card.reader-modal{max-width:720px;max-height:88vh;padding:22px}
    .modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:12px;gap:12px}
    .modal-body{overflow-y:auto;flex-grow:1;font-size:.9rem}
    .reader-content{font-size:.98rem;line-height:1.68;color:var(--text);padding-right:4px}
    .reader-content p{margin-bottom:14px}
    .reader-content h3{color:var(--bold);font-size:1.1rem;margin:18px 0 8px}
    .reader-content blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--muted);margin:12px 0;font-style:italic}
    .reader-thumb{width:100%;max-height:280px;object-fit:cover;border-radius:8px;margin-bottom:16px}
    .modal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:12px}
    .btn, .btn-open-all{
      background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);
      font-size:1.0rem;line-height:1.2;padding:6px 10px;cursor:pointer;flex-shrink:0;
      display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;
      user-select:none;-webkit-user-select:none;gap:4px;
    }
    .btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
    .btn-open-all{background:var(--accent);border-color:var(--accent);color:#fff;font-size:.85rem;font-weight:600;display:none;white-space:nowrap}
    .btn-action{width:100%;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:6px;font-weight:600;cursor:pointer;margin-top:14px}
    .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:110}
    .sidebar{width:290px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:120;transition:all .25s ease;overflow:hidden;white-space:nowrap}
    .sidebar.collapsed{width:0!important;border:none!important;visibility:hidden}
    .sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .source-list{list-style:none;padding:12px;overflow-y:auto;flex-grow:1}
    .source-btn{width:100%;text-align:left;padding:10px 14px;margin-bottom:4px;border-radius:6px;background:transparent;border:none;color:var(--muted);font-size:.85rem;font-weight:500;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .source-btn:hover,.source-btn.active{background:var(--accent-dim);color:var(--accent);font-weight:600}
    .badge-group{display:inline-flex;align-items:center;gap:4px}
    .badge{background:var(--border);padding:2px 7px;border-radius:10px;font-size:.7rem;color:var(--muted);font-weight:500}
    .badge-new{background:var(--accent);color:#fff;font-weight:700}
    .source-btn.active .badge{background:rgba(255,255,255,.15);color:var(--text)}
    .sidebar-footer{padding:16px;border-top:1px solid var(--border)}
    .nav-link{display:block;text-align:center;color:var(--accent);text-decoration:none;font-size:.82rem;font-weight:600;padding:8px;border-radius:6px;background:var(--accent-dim);margin-bottom:8px}
    
    .main{
      flex-grow:1;
      overflow-y:auto;
      position:relative;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
    }
    .stream-header{position:sticky;top:0;z-index:50;background:rgba(18,20,24,.55);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:transform .28s ease}
    .stream-header.header-hidden{transform:translateY(-100%)}
    [data-theme="light"] .stream-header{background:rgba(248,250,252,.65)}
    .header-left{display:flex;align-items:center;gap:12px;flex-shrink:0;min-width:0}
    .header-title-group{display:flex;flex-direction:column;gap:2px}
    .stream-header h2{font-size:1.15rem;font-weight:700;color:var(--bold);white-space:nowrap;cursor:pointer}
    .stream-header h2:hover{color:var(--accent)}
    .header-meta{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);white-space:nowrap}
    .header-right{display:flex;align-items:center;gap:6px;flex-grow:1;justify-content:flex-end;max-width:680px;flex-wrap:nowrap}
    .search-wrap{position:relative;flex:1 1 120px;min-width:65px;display:flex;align-items:center}
    .search-input{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 26px 6px 10px;border-radius:6px;font-size:.85rem;outline:none;width:100%;height:34px}
    .search-input:focus{border-color:var(--accent)}
    .search-clear{position:absolute;right:6px;background:none;border:none;color:var(--muted);font-size:1.05rem;cursor:pointer;display:none;padding:0 4px;line-height:1}
    .search-clear:hover{color:var(--text)}
    mark.hl{background:rgba(234,179,8,.28);color:var(--bold);border-radius:3px;padding:0 2px}
    
    .ptr-box{position:fixed;top:8px;left:0;right:0;height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;z-index:60;pointer-events:none;transition:height .15s ease}
    .ptr-content{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:6px 16px;display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.4);transition:border-color .15s, color .15s}
    .ptr-content.dispatch{border-color:var(--accent);color:var(--accent)}
    .ptr-icon{display:inline-block;transition:transform .15s ease}

    .cards-grid{padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
    .seen-divider{
      grid-column:1 / -1;display:flex;align-items:center;gap:12px;color:var(--muted);
      font-size:.76rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:6px 0;
    }
    .seen-divider::before, .seen-divider::after{content:"";flex:1;height:1px;background:var(--border)}
    .feed-card{
      background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;
      display:flex;flex-direction:column;justify-content:space-between;
      transition:transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
      content-visibility:auto;contain-intrinsic-size:0 150px;touch-action:pan-y;
    }
    .feed-card:hover{transform:translateY(-2px);background:var(--hover)}
    .feed-card.kb-focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
    .feed-card.swipe-bm{border-color:#eab308;box-shadow:0 0 12px rgba(234,179,8,.25)}
    .feed-card.swipe-sh{border-color:#60a5fa;box-shadow:0 0 12px rgba(96,165,250,.25)}
    .unread-dot-btn{background:none;border:none;padding:4px;margin:-4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%}
    .unread-dot-btn:hover{background:var(--hover)}
    .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);transition:all .2s}
    .feed-card.seen .unread-dot{background:var(--muted);box-shadow:none;opacity:.55}
    .feed-card.read .unread-dot{background:transparent;box-shadow:none;border:1.5px solid var(--muted);opacity:.35}
    .feed-card.read .feed-title{color:var(--muted)}
    .action-icon-btn{
      background:none;border:1px solid transparent;padding:3px 6px;border-radius:6px;
      cursor:pointer;font-size:.95rem;opacity:.55;transition:all .15s;
      display:inline-flex;align-items:center;justify-content:center;min-width:28px;min-height:26px;
    }
    .action-icon-btn:hover{opacity:1;background:var(--hover);border-color:var(--border);transform:scale(1.08)}
    .action-icon-btn.has-offline{opacity:.9;color:var(--accent)}
    .feed-card.bookmarked .bookmark-btn{opacity:1;filter:drop-shadow(0 0 4px rgba(234,179,8,.6))}
    .feed-meta{display:flex;align-items:center;gap:6px;font-size:.76rem;margin-bottom:8px;flex-wrap:wrap}
    .feed-source{
      color:var(--accent);font-weight:600;background:none;border:none;padding:2px 6px;margin:-2px -4px;
      border-radius:5px;cursor:pointer;font-family:inherit;font-size:inherit;transition:all .15s;
      display:inline-flex;align-items:center;
    }
    .feed-source:hover{background:var(--accent-dim);color:var(--bold)}
    @media (hover:hover){
      .feed-source:hover .src-label{display:none}
      .feed-source:hover::after{content:"📤 Teilen";color:var(--accent);font-weight:600}
    }
    .feed-time{
      color:var(--muted);font-size:.73rem;background:none;border:none;padding:2px 5px;margin:-2px -3px;
      border-radius:5px;cursor:pointer;font-family:inherit;transition:all .15s;
    }
    .feed-time:hover{color:var(--text);background:var(--hover);text-decoration:underline}
    .feed-others{color:var(--muted);font-size:.72rem}
    .other-src-link{color:var(--muted);text-decoration:underline;text-decoration-color:var(--border);transition:color .15s}
    .other-src-link:hover{color:var(--link);text-decoration-color:var(--link)}
    .feed-title{font-size:1.02rem;font-weight:600;color:var(--bold);text-decoration:none;line-height:1.4;margin-bottom:8px}
    .feed-title:hover{color:var(--link);text-decoration:underline}
    .feed-summary{font-size:.86rem;color:var(--muted);line-height:1.45;margin-bottom:12px}
    .feed-summary strong{color:var(--bold);font-weight:600}
    .feed-thumb{width:100%;height:150px;object-fit:cover;border-radius:6px;margin-top:auto}
    .meta-clickable{color:var(--accent);cursor:pointer}
    .meta-clickable:hover{text-decoration:underline}
    .toast-container{position:fixed;bottom:20px;right:20px;z-index:1000;display:none;max-width:380px;background:var(--sidebar);border:1px solid var(--border);border-radius:10px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:.85rem;color:var(--text);align-items:center;gap:12px;animation:slideUp .25s ease}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .spin{display:inline-block;animation:spin 1.2s linear infinite}
    .toast-link{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
    .toast-link:hover{text-decoration:underline;color:var(--link)}
    .toast-container a{color:var(--link);text-decoration:none;font-weight:600}
    .toast-close{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:0 4px}
    @media (max-width:768px){
      .sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);box-shadow:4px 0 24px rgba(0,0,0,.6)}
      .sidebar.open{transform:translateX(0);visibility:visible!important;width:290px!important}
      .sidebar-backdrop.open{display:block}
      .stream-header{padding:8px 10px;flex-direction:column;align-items:stretch;gap:8px}
      .header-left{width:100%}
      .stream-header h2{font-size:1rem;white-space:normal}
      .header-meta{font-size:.75rem;flex-wrap:wrap}
      .header-right{width:100%;max-width:100%;display:flex;gap:5px;flex-wrap:nowrap;justify-content:space-between}
      .search-wrap{flex:1 1 auto;min-width:55px}
      .btn, .btn-open-all{padding:6px 7px;font-size:.82rem;height:34px}
      .btn-open-all{font-size:.75rem}
      .cards-grid{grid-template-columns:1fr;gap:8px;padding:8px 8px calc(24px + env(safe-area-inset-bottom,0px))}
      .feed-card{padding:14px}
      .modal-card.reader-modal{padding:16px;max-height:92vh}
      .toast-container{left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:none}
    }
  </style>
</head>
<body>
  <div id="auth-overlay" class="modal-overlay" style="z-index:2000">
    <div class="modal-card" style="max-width:380px;text-align:center">
      <h2 style="margin-bottom:8px">🔐 Geschützt</h2>
      <input type="password" id="auth-pwd" class="search-input" style="max-width:100%;margin-bottom:12px" placeholder="Passwort..." onkeydown="if(event.key==='Enter')submitAuth()">
      <button class="btn-action" style="margin-top:0" onclick="submitAuth()">Entschlüsseln</button>
      <div id="auth-err" style="color:#ef4444;font-size:.8rem;margin-top:8px;display:none">Ungültiges Passwort!</div>
    </div>
  </div>
  <div id="reader-modal" class="modal-overlay" onclick="if(event.target===this)toggleModal('reader-modal',false)">
    <div class="modal-card reader-modal">
      <div class="modal-header">
        <div style="flex:1;min-width:0">
          <div id="reader-meta" style="font-size:.78rem;color:var(--accent);font-weight:600;margin-bottom:4px"></div>
          <h2 id="reader-title" style="font-size:1.15rem;line-height:1.35;color:var(--bold)"></h2>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
          <button class="btn" onclick="shareCurrentReaderArticle()" title="Artikel teilen">📤</button>
          <button class="btn" onclick="toggleModal('reader-modal',false)">&times;</button>
        </div>
      </div>
      <div id="reader-body" class="modal-body reader-content"></div>
      <div style="display:flex;gap:10px;margin-top:14px;padding-top:10px;border-top:1px solid var(--border)">
        <a id="reader-orig-link" href="#" target="_blank" rel="noopener" class="btn-action" style="margin-top:0;text-align:center;text-decoration:none;flex:1">Original-Webseite öffnen ↗</a>
        <button class="btn" style="padding:10px 16px" onclick="toggleModal('reader-modal',false)">Schließen</button>
      </div>
    </div>
  </div>
  <div id="health-modal" class="modal-overlay" onclick="if(event.target===this)toggleModal('health-modal',false)">
    <div class="modal-card">
      <div class="modal-header"><h2 id="health-modal-title">📡 Feed-Status</h2><button class="btn" onclick="toggleModal('health-modal',false)">&times;</button></div>
      <div class="modal-body">
        <div style="margin-bottom:12px;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:6px">
          <a href="https://github.com/schoerb/news-hub/actions" target="_blank" rel="noopener" style="color:var(--link);text-decoration:none;display:flex;justify-content:space-between"><span>⚙️ Workflow-Status</span><span>↗</span></a>
        </div>
        <div id="health-list"></div>
      </div>
      <button class="btn-action" onclick="toggleModal('health-modal',false)">Schließen</button>
    </div>
  </div>
  <div id="dup-modal" class="modal-overlay" onclick="if(event.target===this)toggleModal('dup-modal',false)">
    <div class="modal-card">
      <div class="modal-header"><h2>🧹 Bereinigte Duplikate</h2><button class="btn" onclick="toggleModal('dup-modal',false)">&times;</button></div>
      <div id="dup-list" class="modal-body"></div>
      <button class="btn-action" onclick="toggleModal('dup-modal',false)">Schließen</button>
    </div>
  </div>
  <div id="toast" class="toast-container"><span id="toast-msg" style="flex:1"></span><button class="toast-close" onclick="hideToast()">&times;</button></div>
  <div class="sidebar-backdrop" id="backdrop" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><h1>⚡ News-Hub</h1><button class="btn" onclick="toggleSidebar()">&times;</button></div>
    <ul class="source-list" id="source-list"></ul>
    <div class="sidebar-footer">
      <a href="archive.html" class="nav-link">📑 Zum Archiv (24–48h)</a>
      <button class="source-btn" style="text-align:center;background:var(--border)" onclick="markAllRead()">✓ Alle gelesen</button>
    </div>
  </aside>
  <main class="main" id="main-scroller">
    <div id="ptr-box" class="ptr-box">
      <div id="ptr-content" class="ptr-content">
        <span id="ptr-icon" class="ptr-icon">↓</span>
        <span id="ptr-text">Lokale Feeds laden</span>
      </div>
    </div>
    <div class="stream-header">
      <div class="header-left">
        <button class="btn" onclick="toggleSidebar()">☰</button>
        <div class="header-title-group">
          <h2 id="current-title" onclick="document.getElementById('main-scroller').scrollTo({top:0,behavior:'smooth'})" title="Nach oben scrollen">Meldungen laden...</h2>
          <div class="header-meta">
            <span class="meta-clickable" id="header-dup-info" onclick="openDupModal()">🧹 Duplikate</span>
            <span style="color:var(--border)">•</span>
            <span style="color:#eab308;cursor:pointer" onclick="toggleModal('health-modal',true)">🟡 18/22 Feeds</span>
            <span style="color:var(--border)">•</span>
            <span class="meta-clickable" id="sync-status" onclick="manualSyncClick()" title="Geräte-Sync Status">☁️ Sync</span>
            <span style="color:var(--border)">•</span>
            <span class="meta-clickable" id="offline-status" onclick="preloadOfflineArchive(true)" title="Offline-Volltexte & Bilder vorladen">📥 Offline</span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <div class="search-wrap">
          <input type="text" class="search-input" id="search-box" placeholder="Durchsuchen..." oninput="filterSearch(this.value)">
          <button class="search-clear" id="search-clear-btn" onclick="clearSearch()" title="Suche löschen">&times;</button>
        </div>
        <button class="btn-open-all" id="open-all-btn" onclick="openAllBookmarked()" title="Alle gemerkten Artikel in neuen Tabs öffnen">Alle öffnen ↗</button>
        <button class="btn" id="sort-unseen-btn" onclick="toggleSortUnseen()" title="Ungesehene Artikel zuerst sortieren (Taste: s)">⇅</button>
        <button class="btn" id="unread-filter-btn" onclick="toggleUnreadFilter()" title="Nur ungesehene Artikel anzeigen (Taste: u)">👁️ <span id="unread-count">0</span></button>
        <button class="btn" id="saved-filter-btn" onclick="toggleSavedFilter()" title="Später lesen / Lesezeichen">🔖 <span id="saved-count">0</span></button>
        <button class="btn" id="refresh-btn" onclick="triggerWorkflow()" title="GitHub Workflow starten (Taste: r)">🔄</button>
        <button class="btn" onclick="toggleTheme()" title="Design wechseln">🌓</button>
      </div>
    </div>
    <div id="articles-container" class="cards-grid"></div>
  </main>
  <script>
    window.IS_ARCHIVE = false;
    const configuredSources = ["ComputerBase", "OMG! Ubuntu!", "9to5Google", "Topthemen - SZ.de", "WinFuture News", "GoogleWatchBlog", "mobiFlip", "Android Headlines", "Android Police", "teltarif.de", "Düsseldorf | RP ONLINE", "Caschys Blog", "Notebookcheck.com", "Deskmodder.de", "heise online News", "Android Authority", "XDA", "Travel-Dealz.de", "SmartDroid.de", "Aktuell - FAZ.NET", "Android Sage", "9to5Linux"], feedHealth = [{"title": "ComputerBase", "status": "ok", "code": 200}, {"title": "OMG! Ubuntu!", "status": "ok", "code": 200}, {"title": "9to5Google", "status": "ok", "code": 200}, {"title": "Topthemen - SZ.de", "status": "ok", "code": 200}, {"title": "WinFuture News", "status": "error", "code": 403}, {"title": "GoogleWatchBlog", "status": "ok", "code": 200}, {"title": "mobiFlip", "status": "ok", "code": 200}, {"title": "Android Headlines", "status": "ok", "code": 200}, {"title": "Android Police", "status": "ok", "code": 200}, {"title": "teltarif.de", "status": "ok", "code": 200}, {"title": "Düsseldorf | RP ONLINE", "status": "ok", "code": 200}, {"title": "Caschys Blog", "status": "ok", "code": 200}, {"title": "Notebookcheck.com", "status": "ok", "code": 200}, {"title": "Deskmodder.de", "status": "exception", "code": "timeout"}, {"title": "heise online News", "status": "ok", "code": 200}, {"title": "Android Authority", "status": "ok", "code": 200}, {"title": "XDA", "status": "ok", "code": 200}, {"title": "Travel-Dealz.de", "status": "ok", "code": 200}, {"title": "SmartDroid.de", "status": "ok", "code": 200}, {"title": "Aktuell - FAZ.NET", "status": "parse_error", "code": 302}, {"title": "Android Sage", "status": "ok", "code": 200}, {"title": "9to5Linux", "status": "exception", "code": "timeout"}], buildTime = "30.10.2026 13:44";

      for (let i = 0, ch; i < (s || '').length; i++) {

        h1 = Math.imul(h1 ^ ch, 2654435761);

    async function preloadOfflineArchive(manualTrigger = false){
      const el = document.getElementById('offline-status');
      if(el) { el.innerHTML = '📥 ⏳'; el.style.color = 'var(--muted)'; }
      if(manualTrigger) showToast('<span class="spin">⏳</span> Lade Volltexte & Bilder für Offline-Modus...', 0);

      try {
        const r = await fetch('offline.json?t=' + Date.now(), {cache:'no-store'}).catch(() => fetch('offline.json'));
        if(!r.ok) throw new Error(r.status);
        const rawOff = (await r.text()).trim();
        let parsedOff = null;
        const pw = localStorage.getItem('hub_key') || '';

        if(rawOff.startsWith('{')) parsedOff = JSON.parse(rawOff);
        else if(pw){
          const dec = CryptoJS.AES.decrypt(rawOff, pw).toString(CryptoJS.enc.Utf8);
          if(dec && dec.startsWith('{')) parsedOff = JSON.parse(dec);
        }

        if(parsedOff){
          offlineMap = parsedOff;
          try { localStorage.setItem('offline_articles_48h', JSON.stringify(offlineMap)); } catch(e){}
          const cnt = Object.keys(offlineMap).length;
          if(el){ el.innerHTML = `📥 ${cnt} Offline`; el.style.color = 'var(--accent)'; }

          document.querySelectorAll('.feed-card').forEach(c => {
            const rBtn = c.querySelector('.reader-btn');
            if(rBtn) rBtn.classList.toggle('has-offline', Boolean(offlineMap[c.dataset.link]));
          });

          if(manualTrigger && 'caches' in window){
            const imgUrls = liveArticles.map(a => a.image).filter(Boolean).slice(0, 80);
            caches.open('news-hub-v28').then(cache => {
              imgUrls.forEach(u => fetch(u, {mode: 'no-cors'}).then(res => cache.put(u, res)).catch(()=>{}));
            });
            showToast(`✅ ${cnt} Artikel + Bilder für Offline-Modus gespeichert!`, 3500);
          }
        }
      } catch(e){
        loadLocalOfflineCache();
        if(manualTrigger) showToast('⚠️ Offline-Archiv derzeit nur aus lokalem Cache verfügbar.', 3000);
      }
    }

    async function pullCloudSync(showFeedback = false){
      const tk = localStorage.getItem('gh_token');
      if(!tk || isSyncing || !navigator.onLine) return;
      isSyncing = true;
      setSyncUI('☁️ 🔄', 'var(--muted)');
      try {
        const r = await fetch(SYNC_VAR_URL, {
          headers: {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + tk},
          cache: 'no-store'
        });
        if(r.status === 404){ isSyncing = false; await pushCloudSync(); return; }
        if(!r.ok) throw new Error(r.status);
        const data = await r.json();
        const remote = JSON.parse(data.value || '{}');

        const localRem = getRemovedMap(), remoteRem = remote.rem || {};
        const mergedRem = {...localRem};
        for(const [k, ts] of Object.entries(remoteRem)){
          if(!mergedRem[k] || ts > mergedRem[k]) mergedRem[k] = ts;
        }
        setRemovedMap(mergedRem);

        const valid = new Set(globalArticles.map(a => String(hStr(a.link||''))));
        const mergeList = (localKey, remoteArr, typePrefix) => {
          const loc = getStorage(localKey);
          const combined = Array.from(new Set([...loc, ...(remoteArr || [])])).filter(id => {
            if(valid.size > 0 && !valid.has(id)) return false;
            return !mergedRem[`${typePrefix}:${id}`];
          });
          setStorage(localKey, combined);
          return combined;
        };

        const newRead = mergeList('read_news', remote.r, 'r');
        const newSeen = mergeList('seen_news', remote.s, 's');
        const newBm   = mergeList('bookmarked_news', remote.b, 'b');

        document.querySelectorAll('.feed-card').forEach(c => {
          const id = c.dataset.id;
          c.classList.toggle('read', newRead.includes(id));
          c.classList.toggle('seen', newSeen.includes(id));
          c.classList.toggle('bookmarked', newBm.includes(id));
        });
        updateBookmarkCount();
        updateUnreadCount();
        if(onlyUnread || onlySaved) applyFilters();

        setSyncUI('☁️ ✓', 'var(--accent)');
        if(showFeedback) showToast('☁️ Lese-Status synchronisiert!', 2000);
      } catch(e){
        setSyncUI('☁️ ⚠️', '#eab308');
      } finally {
        isSyncing = false;
      }
    }

    async function pushCloudSync(){
      const tk = localStorage.getItem('gh_token');
      if(!tk || !navigator.onLine) return;
      try {
        const payloadObj = {
          r: getStorage('read_news').slice(-600),
          s: getStorage('seen_news').slice(-600),
          b: getStorage('bookmarked_news').slice(-200),
          rem: getRemovedMap(),
          t: Date.now()
        };
        const valStr = JSON.stringify(payloadObj);
        let r = await fetch(SYNC_VAR_URL, {
          method: 'PATCH',
          headers: {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + tk},
          body: JSON.stringify({name: 'NEWSHUB_SYNC', value: valStr})
        });
        if(r.status === 404){
          r = await fetch(SYNC_VARS_CREATE_URL, {
            method: 'POST',
            headers: {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + tk},
            body: JSON.stringify({name: 'NEWSHUB_SYNC', value: valStr})
          });
        }
        if(r.ok || r.status === 204 || r.status === 201){
          setSyncUI('☁️ ✓', 'var(--accent)');
        } else {
          setSyncUI('☁️ ⚠️', '#eab308');
        }
      } catch(e){
        setSyncUI('☁️ ⚠️', '#eab308');
      }
    }

      if (!a.other_sources || !a.other_sources.length) return '';
      const details = a.merged_details || [];
      const linksHtml = a.other_sources.map(src => {
        const match = details.find(d => d.source === src && d.link);
        return match ? `<a href="${escAttr(match.link)}" target="_blank" rel="noopener" class="other-src-link" onclick="event.stopPropagation()">${escAttr(src)}</a>` : escAttr(src);
      }).join(', ');

    function renderUI(articles){
      let totalDups = 0; counts = {};
      for(let i = 0; i < articles.length; i++) {
        const a = articles[i];
        const dupCount = (a.merged_details && a.merged_details.length) ? a.merged_details.length : (a.other_sources || []).length;
        totalDups += dupCount;
        counts[a.source||"Unbekannt"] = (counts[a.source||"Unbekannt"]||0) + 1;
      }
      const tEl = document.getElementById('current-title');
      const dTime = getDisplayTime(articles);
      if(tEl && !onlySaved) tEl.textContent = window.IS_ARCHIVE ? `Archiv: ${articles.length} News bis ${dTime}` : `${articles.length} News bis ${dTime}`;
      const dEl = document.getElementById('header-dup-info'); if(dEl) dEl.innerHTML = `🧹 ${totalDups} Duplikate`;

      const sortBtn = document.getElementById('sort-unseen-btn');
      if(sortBtn) sortBtn.classList.toggle('active', sortUnseenFirst);

      const sorted = Array.from(new Set([...configuredSources, ...Object.keys(counts)])).sort((a,b)=>(counts[b]||0)-(counts[a]||0));
      const sl = document.getElementById('source-list');
      if(sl) {
        sl.innerHTML = `<li><button class="source-btn ${activeSource==='all'?'active':''}" data-src="all" onclick="filterSource('all',this)"><span>Alle</span><span class="badge-group"><span class="badge">${articles.length}</span></span></button></li>` +
          sorted.map(s => `<li><button class="source-btn ${activeSource===s?'active':''}" data-src="${escAttr(s)}" onclick="filterSource('${escAttr(s)}',this)"><span>${escAttr(s)}</span><span class="badge-group"><span class="badge">${counts[s]||0}</span></span></button></li>`).join('');
      }

      const rList = getStorage('read_news'), sList = getStorage('seen_news'), bList = getStorage('bookmarked_news');
      updateBookmarkCount();

      let displayArts = [...articles];
      if(sortUnseenFirst){
        displayArts.sort((a, b) => {
          const idA = String(hStr(a.link||'')), idB = String(hStr(b.link||''));
          const uA = (!rList.includes(idA) && !sList.includes(idA)) ? 1 : 0;
          const uB = (!rList.includes(idB) && !sList.includes(idB)) ? 1 : 0;
          return uB !== uA ? uB - uA : (b._ts || 0) - (a._ts || 0);
        });
      }

      const cont = document.getElementById('articles-container');
      if(cont) {
        let htmlBuf = '';
        let dividerInserted = false;
        let hasAnyUnseen = false;

        for(let i = 0; i < displayArts.length; i++) {
          const a = displayArts[i];
          const id = String(hStr(a.link||'')), oth = renderOtherSources(a);
          const isUnseen = !rList.includes(id) && !sList.includes(id);
          if(isUnseen) hasAnyUnseen = true;

          if(sortUnseenFirst && !isUnseen && hasAnyUnseen && !dividerInserted && !onlyUnread){
            htmlBuf += `<div class="seen-divider" id="seen-divider">✓ Bis hierhin bereits gesehen</div>`;
            dividerInserted = true;
          }

          const img = a.image ? `<img class="feed-thumb" src="${escAttr(a.image)}" loading="lazy" referrerpolicy="no-referrer" onload="if(this.naturalWidth<80||this.naturalHeight<60)this.remove()" onerror="this.remove()">` : '';
          const cls = (rList.includes(id)?' read':'') + (sList.includes(id)?' seen':'') + (bList.includes(id)?' bookmarked':'');
          const safeTitle = escAttr(a.title||'Ohne Titel'), safeLink = escAttr(a.link||'#'), safeSrcs = escAttr([a.source||'',...(a.other_sources||[])].join(';;;'));
          const hasOff = Boolean(offlineMap[a.link]);
          const exactTimeTooltip = escAttr(formatExactTime(a.published));

          htmlBuf += `<article class="feed-card${cls}" data-id="${id}" data-link="${safeLink}" data-title="${safeTitle}" data-sources="${safeSrcs}">
            <div class="feed-content">
              <div class="feed-meta">
                <button class="action-icon-btn bookmark-btn" onclick="event.stopPropagation();toggleBookmark('${id}')" title="Merken (Taste: b)">🔖</button>
                <button class="feed-source" onclick="event.stopPropagation();shareCard(this)" title="Link teilen / kopieren"><span class="src-label">${escAttr(a.source||'Quelle')}</span></button>
                <button class="unread-dot-btn" onclick="event.stopPropagation();toggleRead('${id}')" title="Status umschalten (Taste: m)"><span class="unread-dot"></span></button>
                <button class="feed-time" onclick="event.stopPropagation();handleTimeClick('${id}')" title="${exactTimeTooltip ? exactTimeTooltip + ' – ' : ''}Klicken: Ab hier abwärts als gelesen markieren">${relTime(a.published)}</button>
                <button class="action-icon-btn reader-btn ${hasOff?'has-offline':''}" onclick="event.stopPropagation();openReaderModal('${id}')" title="Offline-Lesemodus öffnen (Taste: v)">📖</button>
                ${oth}
              </div>
              <a class="feed-title" href="${safeLink}" target="_blank" rel="noopener" onclick="return handleArticleClick(event, '${id}', '${safeLink}')">${safeTitle}</a>
              <p class="feed-summary" data-raw="${escAttr(a.summary||'')}">${a.summary||''}</p>
            </div>${img}
          </article>`;
        }
        cont.innerHTML = htmlBuf;
        updateUnreadCount();
        applyFilters();
      }
    }

    function openDupModal(){
      const el = document.getElementById('dup-list'); if(!el) return;
      const m = {};
      let tot = 0;
      
      liveArticles.forEach(a => {
        const details = a.merged_details || [];
        if (details.length) {
          details.forEach(d => {
            const s = d.source || "Unbekannt";
            (m[s] = m[s] || []).push(d);
            tot++;
          });
        } else if (a.other_sources && a.other_sources.length) {
          a.other_sources.forEach(src => {
            (m[src] = m[src] || []).push({ source: src, title: "Zusammengefasste Quelle", link: a.link, matched_with: a.title, is_legacy: true });
            tot++;
          });
        }
      });

      const entries = Object.entries(m).sort((a,b) => b[1].length - a[1].length);
      el.innerHTML = !entries.length ? '<p style="color:var(--muted);padding:10px 0">Keine Duplikate gefunden.</p>' :
        `<div style="margin-bottom:10px;font-weight:600;color:var(--accent)">Gesamt: ${tot} bereinigte Berichte</div>` +
        entries.map(([src, items], i) => `<div style="border-bottom:1px solid var(--border);padding:6px 0">
          <div class="modal-row" style="border:none;cursor:pointer" onclick="const e=document.getElementById('dd-${i}');e.style.display=e.style.display==='none'?'block':'none'">
            <strong>${escAttr(src)}</strong><span class="badge">${items.length} ▾</span>
          </div>
          <div id="dd-${i}" style="display:none;padding-left:8px;border-left:2px solid var(--accent);margin-top:4px">
            ${items.map(it=>`<div style="margin-bottom:6px">${it.is_legacy?escAttr(it.title):`<a href="${escAttr(it.link)}" target="_blank" rel="noopener" style="color:var(--link);text-decoration:none">🔗 ${escAttr(it.title)}</a>`}<div style="color:var(--muted);font-size:.72rem">↳ Mit: "${escAttr(it.matched_with)}"</div></div>`).join('')}
          </div>
        </div>`).join('');
      toggleModal('dup-modal', true);
    }

    function filterSource(src, btn){
      activeSource = src; document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      const t = document.getElementById('current-title');
      const dTime = getDisplayTime(liveArticles);
      if(t && !onlySaved) t.textContent = (src==='all')?(window.IS_ARCHIVE?`Archiv: ${liveArticles.length} News bis ${dTime}`:`${liveArticles.length} News bis ${dTime}`):`${src} (${counts[src]||0}) bis ${dTime}`;
      applyFilters(); if(window.innerWidth<=768) toggleSidebar();
    }

    function clearSearch(){
      const sb = document.getElementById('search-box');
      if(sb){ sb.value = ''; filterSearch(''); sb.focus(); }
    }

    function filterSearch(q){
      const clr = document.getElementById('search-clear-btn');
      if(clr) clr.style.display = q.length > 0 ? 'block' : 'none';
      clearTimeout(sTimer);
      sTimer = setTimeout(()=>{ searchQuery = q.toLowerCase().trim(); applyFilters(); }, 100);
    }

    function highlightText(htmlStr, query){
      if(!query || query.length < 2) return htmlStr;
      const escQ = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`(${escQ})(?![^<]*>)`, 'gi');
      return htmlStr.replace(re, '<mark class="hl">$1</mark>');
    }

    function applyFilters(){
      const bList = getStorage('bookmarked_news'), rList = getStorage('read_news'), sList = getStorage('seen_news');
      kbIndex = -1;
      document.querySelectorAll('.feed-card').forEach(c => {
        c.classList.remove('kb-focus');
        const id = c.dataset.id;
        const hasGreenDot = !rList.includes(id) && !sList.includes(id);
        const show = (!onlySaved || bList.includes(id)) &&
                     (!onlyUnread || hasGreenDot) &&
                     (activeSource==='all' || (c.dataset.sources||'').split(';;;').includes(activeSource)) &&
                     (!searchQuery || c.textContent.toLowerCase().includes(searchQuery));
        c.style.display = show ? '' : 'none';

        if(show){
          const titleEl = c.querySelector('.feed-title');
          const sumEl = c.querySelector('.feed-summary');
          if(titleEl) titleEl.innerHTML = highlightText(escAttr(c.dataset.title), searchQuery);
          if(sumEl && sumEl.dataset.raw !== undefined) sumEl.innerHTML = highlightText(sumEl.dataset.raw, searchQuery);
        }
      });
      const div = document.getElementById('seen-divider');
      if(div) div.style.display = (onlyUnread || onlySaved || searchQuery || activeSource !== 'all') ? 'none' : '';
      updateUnreadCount();
    }

    function triggerWorkflow(){
      const tk = localStorage.getItem('gh_token');
      if(!tk){
        showToast(`
          <div style="display:flex;flex-direction:column;gap:6px">
            <span>GitHub PAT (für Sync & Action-Start):</span>
            <div style="display:flex;gap:6px">
              <input type="password" id="toast-token-inp" class="search-input" style="padding:4px 8px;font-size:.8rem;height:28px" placeholder="ghp_...">
              <button class="btn" style="font-size:.8rem;padding:4px 8px;height:28px" onclick="saveToastToken()">OK</button>
            </div>
          </div>
        `, 0);
      } else { dispatchWorkflow(tk); }
    }

    function saveToastToken(){
      const el = document.getElementById('toast-token-inp');
      if(el && el.value.trim()){
        const val = el.value.trim();
        localStorage.setItem('gh_token', val);
        pullCloudSync(true);
        dispatchWorkflow(val);
      }
    }

    async function dispatchWorkflow(tk){
      showToast('<a href="https://github.com/schoerb/news-hub/actions" target="_blank" rel="noopener" class="toast-link"><span class="spin">🔄</span> Starte Build... ↗</a>', 0);
      const startTime = new Date(Date.now() - 30000).toISOString();
      try {
        const r = await fetch('https://api.github.com/repos/schoerb/news-hub/actions/workflows/deploy.yml/dispatches', {
          method:'POST', headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer ' + tk}, body:JSON.stringify({ref:'main'})
        });
        if(r.status === 204){
          showToast('<a href="https://github.com/schoerb/news-hub/actions" target="_blank" rel="noopener" class="toast-link"><span class="spin">⏳</span> GitHub Action läuft... ↗</a>', 0);
          startWorkflowPolling(tk, startTime);
        } else {
          showToast(`⚠️ Fehler (${r.status}). <a href="#" onclick="localStorage.removeItem('gh_token');triggerWorkflow();return false;">Token neu</a>`, 8000);
        }
      } catch(e){ showToast('❌ Netzwerkfehler: ' + e.message, 6000); }
    }

    function startWorkflowPolling(tk, startTime){
      clearInterval(pollInterval);
      let attempts = 0;
      pollInterval = setInterval(async () => {
        if(++attempts > 50){ clearInterval(pollInterval); showToast('⚠️ Timeout. <a href="https://github.com/schoerb/news-hub/actions" target="_blank" rel="noopener">Actions prüfen ↗</a>', 8000); return; }
        try {
          const r = await fetch('https://api.github.com/repos/schoerb/news-hub/actions/runs?event=workflow_dispatch&per_page=1', {
            headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer ' + tk}
          });
          if(!r.ok) return;
          const data = await r.json(), run = data.workflow_runs && data.workflow_runs[0];
          const runUrl = (run && run.html_url) || 'https://github.com/schoerb/news-hub/actions';
          if(run && new Date(run.created_at) >= new Date(startTime)){
            if(run.status === 'in_progress' || run.status === 'queued') showToast(`<a href="${runUrl}" target="_blank" rel="noopener" class="toast-link"><span class="spin">⏳</span> Build läuft... (${attempts * 5}s) ↗</a>`, 0);
            else if(run.status === 'completed'){
              clearInterval(pollInterval);
              if(run.conclusion === 'success'){
                showToast(`<a href="${runUrl}" target="_blank" rel="noopener" class="toast-link">🎉 Update fertig! Aktualisiere... ↗</a>`, 0);
                setTimeout(() => reloadDataSilent(false), 2000);
              } else { showToast(`❌ Fehlgeschlagen (${run.conclusion}). <a href="${runUrl}" target="_blank" rel="noopener">Log ↗</a>`, 9000); }
            }
          }
        } catch(e) {}
      }, 5000);
    }

    async function reloadDataSilent(showFeedback = true){
      if(showFeedback) showToast('<span class="spin">⏳</span> Lade lokale Feeds...', 2000);
      try {
        const r = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
        if(!r.ok) throw new Error();
        rawData = await r.text();
        lastFetchTs = Date.now();
        const parsed = parsePayload(localStorage.getItem('hub_key')||"");
        if(parsed) {
          globalArticles = parsed;
          onLoaded();
          if(showFeedback) showToast('✅ Feeds aktualisiert!', 3000);
        } else {
          location.reload();
        }
      } catch(e){
        if(showFeedback) showToast('⚡ Offline-Modus aktiv (lokaler Cache)', 2500);
      }
    }

    function parsePayload(pw){
      try {
        if(!rawData) return null;
        const trimmed = rawData.trim();
        if(trimmed.startsWith('[')) return JSON.parse(trimmed);
        if(!pw) return null;
        const dec = CryptoJS.AES.decrypt(trimmed, pw).toString(CryptoJS.enc.Utf8);
        return (dec && dec.startsWith('[')) ? JSON.parse(dec) : null;
      } catch(e){ return null; }
    }

    async function init(){
      initTheme();
      loadLocalOfflineCache();
      updateOnlineStatusUI();
      if(window.innerWidth>768 && localStorage.getItem('sidebar_closed')==='true') document.getElementById('sidebar').classList.add('collapsed');
      
      const scroller = document.getElementById('main-scroller');
      const ptrBox = document.getElementById('ptr-box');
      const ptrContent = document.getElementById('ptr-content');
      const ptrIcon = document.getElementById('ptr-icon');
      const ptrText = document.getElementById('ptr-text');

      let touchStartX = 0, touchStartY = 0, isPulling = false, touchTargetCard = null, hasVibrated = false;

      const PULL_MIN = 25;
      const PULL_WORKFLOW = 180;

      scroller.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].screenX;
        touchStartY = e.touches[0].screenY;
        touchTargetCard = e.target.closest('.feed-card');
        isPulling = (scroller.scrollTop <= 0);
        hasVibrated = false;
      }, {passive:true});

      scroller.addEventListener('touchmove', e => {
        const currentY = e.touches[0].screenY;
        const currentX = e.touches[0].screenX;
        const diffY = currentY - touchStartY;
        const diffX = currentX - touchStartX;

        if(isPulling && diffY > PULL_MIN && Math.abs(diffY) > Math.abs(diffX) && scroller.scrollTop <= 0){
          if(e.cancelable) e.preventDefault();

          const pullDist = Math.min(48 + (diffY - PULL_MIN) * 0.28, 105);
          ptrBox.style.height = `${pullDist}px`;

          if(diffY >= PULL_WORKFLOW){
            if(!hasVibrated && navigator.vibrate){ navigator.vibrate(35); hasVibrated = true; }
            ptrContent.classList.add('dispatch');
            ptrIcon.style.transform = 'rotate(180deg)';
            ptrIcon.innerHTML = '🚀';
            ptrText.textContent = 'Workflow starten (Loslassen)';
          } else {
            hasVibrated = false;
            ptrContent.classList.remove('dispatch');
            ptrIcon.style.transform = 'rotate(0deg)';
            ptrIcon.innerHTML = '↓';
            ptrText.textContent = 'Lokale Feeds laden';
          }
        } 
        else if(touchTargetCard && Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) < 120){
          touchTargetCard.style.transform = `translateX(${diffX * 0.35}px)`;
          const ready = Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY) * 1.4;
          touchTargetCard.classList.toggle('swipe-sh', ready && diffX > 0);
          touchTargetCard.classList.toggle('swipe-bm', ready && diffX < 0);
        }
      }, {passive:false});

      scroller.addEventListener('touchend', e => {
        const diffY = e.changedTouches[0].screenY - touchStartY;
        const diffX = e.changedTouches[0].screenX - touchStartX;

        if(isPulling && diffY >= PULL_MIN && scroller.scrollTop <= 0){
          if(diffY >= PULL_WORKFLOW){
            ptrBox.style.height = '48px';
            ptrIcon.innerHTML = '🔄';
            ptrIcon.className = 'ptr-icon spin';
            ptrText.textContent = 'Starte Workflow...';
            triggerWorkflow();
            setTimeout(() => {
              ptrBox.style.height = '0';
              ptrIcon.className = 'ptr-icon';
              ptrContent.classList.remove('dispatch');
            }, 1200);
          } else {
            ptrBox.style.height = '48px';
            ptrIcon.innerHTML = '🔄';
            ptrIcon.className = 'ptr-icon spin';
            ptrText.textContent = 'Lade Artikel...';
            reloadDataSilent(false);
            setTimeout(() => {
              ptrBox.style.height = '0';
              ptrIcon.className = 'ptr-icon';
            }, 700);
          }
        } else {
          ptrBox.style.height = '0';
        }
        isPulling = false;

        if(touchTargetCard){
          touchTargetCard.style.transform = '';
          touchTargetCard.classList.remove('swipe-sh', 'swipe-bm');
          if(Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY) * 1.4){
            if(diffX > 0) shareArticle(touchTargetCard.dataset.title, touchTargetCard.dataset.link);
            else toggleBookmark(touchTargetCard.dataset.id);
          }
          touchTargetCard = null;
        }
      }, {passive:true});

      try {
        const r = await fetch('data.json?t=' + Date.now(), {cache:'no-store'}).catch(() => fetch('data.json'));
        if(!r.ok) throw new Error(r.status);
        rawData = await r.text();
        lastFetchTs = Date.now();
      } catch(e){
        document.getElementById('current-title').textContent = "Fehler beim Laden von data.json";
        return;
      }

      let parsed = parsePayload('') || (localStorage.getItem('hub_key') ? parsePayload(localStorage.getItem('hub_key')) : null);
      if(parsed) {
        globalArticles = parsed;
        onLoaded();
      } else {
        document.getElementById('auth-overlay').style.display = 'flex';
        document.getElementById('auth-pwd').focus();
      }
    }

    function submitAuth(){
      const pw = document.getElementById('auth-pwd').value, parsed = parsePayload(pw);
      if(parsed) {
        localStorage.setItem('hub_key', pw);
        globalArticles = parsed;
        onLoaded();
      } else {
        document.getElementById('auth-err').style.display = 'block';
      }
    }

    function onLoaded(){
      try {
        document.getElementById('auth-overlay').style.display = 'none';
        const valid = new Set(globalArticles.map(a => String(hStr(a.link||''))));
        ['read_news', 'seen_news', 'bookmarked_news'].forEach(k => setStorage(k, getStorage(k).filter(id => valid.has(id))));

        const now = Date.now(), c24 = new Date(now - 86400000), c48 = new Date(now - 172800000);
        liveArticles = globalArticles.filter(a => {
          if (!a.published) return !window.IS_ARCHIVE;
          const p = new Date(a.published);
          return isNaN(p.getTime()) ? !window.IS_ARCHIVE : (window.IS_ARCHIVE ? (p < c24 && p >= c48) : (p >= c24));
        });
        if(!window.IS_ARCHIVE && !liveArticles.length && globalArticles.length) liveArticles = globalArticles;

        renderUI(liveArticles);

        if(localStorage.getItem('gh_token') && navigator.onLine){
          pullCloudSync(false);
        }

        if(navigator.onLine){
          setTimeout(() => preloadOfflineArchive(false), 1200);
        }

        const timers = new Map(), obs = new IntersectionObserver(ents => {
          ents.forEach(e => {
            const id = e.target.dataset.id;
            if(!id) return;
            if(e.isIntersecting){
              timers.set(id, setTimeout(() => {
                const s = getStorage('seen_news');
                if(!s.includes(id)){
                  s.push(id);
                  unmarkRemoved(id, 's');
                  setStorage('seen_news', s);
                  updateUnreadCount();
                  scheduleCloudPush();
                }
                e.target.classList.add('seen');
                obs.unobserve(e.target);
              }, 1000));
            } else if(timers.has(id)){
              clearTimeout(timers.get(id));
              timers.delete(id);
            }
          });
        }, {root: document.querySelector('.main'), threshold: 0.6});
        document.querySelectorAll('.feed-card:not(.seen)').forEach(c => obs.observe(c));

        let lastY = 0; const mEl = document.querySelector('.main'), hEl = document.querySelector('.stream-header');
        mEl.addEventListener('scroll', () => {
          const y = mEl.scrollTop;
          if(Math.abs(lastY-y) > 6 && document.activeElement !== document.getElementById('search-box')) {
            hEl.classList.toggle('header-hidden', y > lastY && y > 50);
            lastY = y;
          }
        }, {passive:true});

        const failedFeedsList = feedHealth.filter(f => f.status !== 'ok' && f.code !== 304 && f.code !== 200);
        const failedCount = failedFeedsList.length;
        const modalTitleEl = document.getElementById('health-modal-title');
        if(modalTitleEl) modalTitleEl.textContent = failedCount > 0 ? `📡 Feed-Status (${failedCount} gestört)` : `📡 Feed-Status`;

        const hl = document.getElementById('health-list');
        if(hl) {
          hl.innerHTML = feedHealth.map(f => {
            const ok = f.status==='ok'||f.code===304||f.code===200;
            return `<div class="modal-row"><span>${ok?'🟢':'🔴'} ${escAttr(f.title)}</span><span style="color:${ok?'var(--muted)':'#ef4444'};font-family:monospace">${f.code||f.status}</span></div>`;
          }).join('');
        }
      } catch(err) {
        console.error(err);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState==='visible'){
        if(Date.now() - lastFetchTs > 900000 && navigator.onLine){
          reloadDataSilent(true);
        } else {
          if(navigator.onLine) pullCloudSync(false);
          document.querySelectorAll('.feed-card').forEach(c => {
            const art = liveArticles.find(a => String(hStr(a.link||'')) === c.dataset.id);
            if(art && art.published) c.querySelector('.feed-time').textContent = relTime(art.published);
          });
        }
      }
    });

    document.addEventListener('keydown', e => {
      if(['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        if(e.key==='Escape'){
          if(document.activeElement.id === 'search-box' && document.activeElement.value) clearSearch();
          document.activeElement.blur();
        }
        return;
      }
      if(e.key==='[') toggleSidebar();
      if(e.key==='r') triggerWorkflow();
      if(e.key==='u') toggleUnreadFilter();
      if(e.key==='s') toggleSortUnseen();
      if(e.key==='/'){ e.preventDefault(); document.getElementById('search-box').focus(); }
      if(e.key==='Escape'){ toggleModal('reader-modal',false); toggleModal('health-modal',false); toggleModal('dup-modal',false); hideToast(); }

      const visibleCards = Array.from(document.querySelectorAll('.feed-card')).filter(c => c.style.display !== 'none');
      if(!visibleCards.length) return;

      if(e.key==='j' || e.key==='k'){
        e.preventDefault();
        visibleCards.forEach(c => c.classList.remove('kb-focus'));
        kbIndex = e.key==='j' ? Math.min(kbIndex + 1, visibleCards.length - 1) : Math.max(kbIndex - 1, 0);
        const active = visibleCards[kbIndex];
        if(active){
          active.classList.add('kb-focus');
          active.scrollIntoView({behavior:'smooth', block:'nearest'});
        }
      } else if(kbIndex >= 0 && kbIndex < visibleCards.length){
        const active = visibleCards[kbIndex];
        const id = active.dataset.id;
        if(e.key==='o'){ window.open(active.dataset.link, '_blank'); if(!getStorage('read_news').includes(id)) toggleRead(id); }
        if(e.key==='v'){ e.preventDefault(); openReaderModal(id); }
        if(e.key==='m') toggleRead(id);
        if(e.key==='b') toggleBookmark(id);
      }
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
